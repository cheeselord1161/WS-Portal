<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Forkd AI</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="icon" type="image/x-icon" href="favicon.ico">

  <style>
:root {
  --bg: #000000;
  --surface: #0a0a0a;
  --border: rgba(255, 255, 255, 0.12);
  --accent: #ffffff;
  --text: #ffffff;
}

body.light-mode {
  --bg: #ffffff;
  --surface: #f5f5f5;
  --border: rgba(0, 0, 0, 0.12);
  --accent: #000000;
  --text: #000000;
}

body.no-animations,
body.no-animations * {
  animation: none !important;
  transition: none !important;
}

    body {
      margin: 0;
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }

    /* Ambient Background Glow */
    .glow {
      position: absolute;
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(0,229,160,0.05) 0%, rgba(0,0,0,0) 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: -1;
    }

    .login-card {
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 2.5rem;
      border-radius: 24px;
      width: 100%;
      max-width: 380px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
    }

    .logo-area {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: 1.2rem;
      margin-bottom: 2rem;
    }

    .logo-img {
      height: 24px;
      width: auto;
      object-fit: contain;
    }

    h1 {
      font-family: 'Syne', sans-serif;
      font-size: 1.8rem;
      margin-bottom: 0.5rem;
      letter-spacing: -0.02em;
    }

    p {
      color: #7a8a84;
      font-size: 0.95rem;
      margin-bottom: 2rem;
    }

    .auth-buttons {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .btn-auth {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 14px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: white;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .btn-auth:hover {
      background: #181c1c;
      border-color: rgba(255,255,255,0.2);
      transform: translateY(-2px);
    }

    .btn-auth svg {
      width: 20px;
      height: 20px;
    }

    .footer-note {
      margin-top: 2rem;
      font-size: 0.75rem;
      color: #4a5652;
    }

    .error-message {
      min-height: 1.25rem;
      margin-top: 1rem;
      font-size: 0.8rem;
      color: #ff7b7b;
    }

    .footer-note a {
      color: #ffffff;
    }
  </style>
<link rel="stylesheet" href="/forkd-theme.css">
</head>
<body>

  <div class="glow"></div>

  <div class="login-card">
    <div class="logo-area">
      <img src="logo.png" alt="Forkd logo" class="logo-img">
      Forkd AI
    </div>
    
    <h1>Welcome back</h1>
    <p>Sign in to manage your changelogs</p>

    <div class="auth-buttons">
      <button class="btn-auth" onclick="login('google')">
        <svg viewBox="0 0 24 24">
          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
        </svg>
        Continue with Google
      </button>

      <button class="btn-auth" onclick="login('github')">
        <svg fill="currentColor" viewBox="0 0 24 24">
          <path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"/>
        </svg>
        Continue with GitHub
      </button>
    </div>

    <div id="error-message" class="error-message" aria-live="polite"></div>

    <div class="footer-note">
      By signing in, you agree to our <a href="terms.html">Terms of Service</a> and <a href="privacy.html">Privacy Policy</a>.
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider, GithubAuthProvider, fetchSignInMethodsForEmail, linkWithPopup } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // Load appearance preferences
    function loadAppearancePreferences() {
      const darkModeEnabled = localStorage.getItem('darkMode') !== 'false';
      const animationsEnabled = localStorage.getItem('animationsEnabled') !== 'false';

      if (!darkModeEnabled) {
        document.body.classList.add('light-mode');
      }

      if (!animationsEnabled) {
        document.body.classList.add('no-animations');
      }
    }

    // Load preferences on page load
    loadAppearancePreferences();

    const firebaseConfig = {
      apiKey: "AIzaSyBu1N-awPnUjXAVqzWtCyhxTDBC-4QPNak",
      authDomain: "changlelog-generator.firebaseapp.com",
      projectId: "changlelog-generator",
      storageBucket: "changlelog-generator.firebasestorage.app",
      messagingSenderId: "640801556466",
      appId: "1:640801556466:web:2bce80e0bab1021cc44d6b"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    window.login = async (providerName) => {
      const errorMessage = document.getElementById('error-message');
      const provider = providerName === 'google' ? new GoogleAuthProvider() : new GithubAuthProvider();

      if (errorMessage) errorMessage.textContent = '';

      try {
        const result = await signInWithPopup(auth, provider);
        const user = result.user;

        // Save user to Firestore
        await setDoc(doc(db, "users", user.uid), {
          uid: user.uid,
          email: user.email,
          displayName: user.displayName,
          photoURL: user.photoURL,
          lastLogin: new Date()
        }, { merge: true });

        window.location.href = "/index.html";
      } catch (error) {
        console.error("Auth error:", error);
        if (errorMessage) {
          // Handle account-exists-with-different-credential error
          if (error.code === 'auth/account-exists-with-different-credential') {
            const email = error.customData?.email;
            const pendingCred = error.credential;
            
            if (email && pendingCred) {
              try {
                // Check what sign-in methods exist for this email
                const methods = await fetchSignInMethodsForEmail(auth, email);
                const methodNames = methods.join(' or ');
                
                errorMessage.textContent = `This email is already registered with ${methodNames}. Please sign in with that method instead.`;
              } catch (checkError) {
                errorMessage.textContent = 'This account is already registered. Please try signing in with a different method.';
              }
            } else {
              errorMessage.textContent = 'This account is already registered. Please try signing in with a different method.';
            }
          } else if (error.code === 'auth/popup-closed-by-user') {
            errorMessage.textContent = 'Sign-in popup was closed before completing authentication.';
          } else {
            errorMessage.textContent = 'Unable to sign in right now. Please try again.';
          }
        }
      }
    };
  </script>
</body>
</html>
