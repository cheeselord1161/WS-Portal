<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<!--FORKD_META-->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="icon" type="image/x-icon" href="favicon.ico">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#030305;--surface:#0a0a0e;--surface2:#111116;--surface3:#18181d;--border:rgba(255,255,255,0.07);--border-hover:rgba(255,255,255,0.14);--accent:#fff;--accent-dim:rgba(255,255,255,0.08);--text:#f0f0f0;--text-muted:#9999aa;--text-dim:#555;--danger:#ff4545;--success:#28c840;--warning:#f59e0b;--font-ui:'Inter',sans-serif;--font-mono:'SF Mono','Fira Code','IBM Plex Mono',monospace;--radius:8px;--radius-lg:12px;--radius-xl:16px}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:var(--font-ui);min-height:100vh}
body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(255,255,255,0.02) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,0.02) 1px,transparent 1px);background-size:56px 56px;pointer-events:none;z-index:0}
.glow-orb{position:fixed;border-radius:50%;filter:blur(100px);pointer-events:none;z-index:0;opacity:.6}
.glow-1{width:500px;height:500px;background:radial-gradient(circle,rgba(255,255,255,0.04) 0%,transparent 70%);top:-200px;left:-100px}
nav{display:flex;justify-content:center;padding:14px 20px;position:sticky;top:0;z-index:100;background:rgba(3,3,5,.85);backdrop-filter:blur(16px);border-bottom:1px solid var(--border)}
.nav-inner{width:100%;max-width:960px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.logo{display:flex;align-items:center;gap:10px;font-size:.95rem;font-weight:800;letter-spacing:-.03em;text-decoration:none;color:var(--text)}
.logo-img{height:22px;width:auto}
.nav-links{display:flex;align-items:center;gap:12px}
.nav-link{font-size:.82rem;font-weight:500;color:var(--text-muted);text-decoration:none;transition:color .15s}
.nav-link:hover{color:var(--text)}
.container{max-width:960px;margin:0 auto;padding:2rem;position:relative;z-index:1}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.project-header{display:flex;gap:1.25rem;padding:2rem 0 1.5rem;align-items:flex-start;flex-wrap:wrap;animation:fadeUp .35s ease}
.project-logo{width:64px;height:64px;border-radius:var(--radius-lg);border:1px solid var(--border);background:var(--surface2);object-fit:cover;display:flex;align-items:center;justify-content:center;font-size:1.5rem;font-weight:800;color:var(--accent);flex-shrink:0}
.project-main{flex:1;min-width:240px}
.project-title-row{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;margin-bottom:.4rem}
.project-name{font-size:clamp(1.4rem,3.5vw,2rem);font-weight:900;letter-spacing:-.04em;line-height:1.1}
.badge{font-family:var(--font-mono);font-size:.62rem;font-weight:600;padding:3px 8px;border-radius:5px;background:var(--accent-dim);color:var(--text-muted);border:1px solid var(--border);text-decoration:none;white-space:nowrap}
.badge.verified{color:var(--success);border-color:rgba(40,200,64,.3);background:rgba(40,200,64,.08)}
.badge.imported{color:var(--warning);border-color:rgba(245,158,11,.3);background:rgba(245,158,11,.08)}
.project-desc{font-size:.92rem;color:var(--text-muted);line-height:1.7;max-width:640px;margin-bottom:.85rem}
.project-meta{display:flex;align-items:center;gap:1rem;flex-wrap:wrap;font-family:var(--font-mono);font-size:.72rem;color:var(--text-dim)}
.project-meta a{color:var(--text-muted);text-decoration:none}
.project-meta a:hover{color:var(--accent);text-decoration:underline}
.tag-list{display:flex;gap:.4rem;flex-wrap:wrap;margin-top:.7rem}
.tag{font-family:var(--font-mono);font-size:.65rem;color:var(--text-dim);border:1px solid var(--border);border-radius:999px;padding:3px 9px}
.project-actions{display:flex;gap:.6rem;flex-shrink:0;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;padding:.6rem 1.2rem;border-radius:var(--radius-lg);font-family:var(--font-ui);font-size:.82rem;font-weight:600;text-decoration:none;cursor:pointer;transition:all .15s;border:none}
.btn-primary{background:var(--accent);color:#030305}
.btn-primary:hover{transform:translateY(-1px)}
.btn-ghost{background:var(--surface2);color:var(--text-muted);border:1px solid var(--border)}
.btn-ghost:hover{color:var(--text);border-color:var(--border-hover)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none!important}
.following{border-color:var(--accent)!important;color:var(--accent)!important}
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:1rem;border-top:1px solid var(--border);padding-top:1.5rem;margin-top:.5rem;flex-wrap:wrap}
.section-head h2{font-size:1rem;font-weight:700}
.section-head .sub{font-family:var(--font-mono);font-size:.7rem;color:var(--text-dim)}
.release-list{display:flex;flex-direction:column;gap:.6rem;margin-top:1rem}
.release-item{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-xl);padding:1.15rem 1.4rem;text-decoration:none;color:var(--text);transition:all .15s;display:block;animation:fadeUp .3s ease}
.release-item:hover{border-color:var(--border-hover);background:var(--surface2);transform:translateY(-1px)}
.release-title{font-size:.92rem;font-weight:700;margin-bottom:.3rem;display:flex;align-items:center;gap:.5rem;flex-wrap:wrap}
.release-excerpt{font-size:.82rem;color:var(--text-muted);line-height:1.6;margin-bottom:.5rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.release-meta{display:flex;align-items:center;gap:.7rem;flex-wrap:wrap;font-family:var(--font-mono);font-size:.68rem;color:var(--text-dim)}
.release-meta .ver{color:var(--text-muted);font-weight:600}
.empty-state{padding:3rem 2rem;text-align:center;font-family:var(--font-mono);font-size:.82rem;color:var(--text-dim);border:1px dashed var(--border);border-radius:var(--radius-xl);margin-top:1rem}
.spinner{width:22px;height:22px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;margin:2.5rem auto}
@keyframes spin{to{transform:rotate(360deg)}}
.hidden{display:none!important}
footer{text-align:center;padding:2rem;font-family:var(--font-mono);font-size:.65rem;color:var(--text-dim);border-top:1px solid var(--border);position:relative;z-index:1;margin-top:2rem}
footer a{color:var(--text-muted);text-decoration:none}
.toast{position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%);background:var(--surface2);border:1px solid var(--border-hover);color:var(--text);font-size:.8rem;padding:.7rem 1.2rem;border-radius:var(--radius-lg);z-index:200;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
@media(max-width:640px){.container{padding:1rem}.project-actions{width:100%}.project-actions .btn{flex:1;justify-content:center}}
</style>
<link rel="stylesheet" href="/forkd-theme.css">
</head>
<body>
<div class="glow-orb glow-1"></div>

<nav><div class="nav-inner">
  <a href="/" class="logo"><img src="logo.png" alt="" class="logo-img">Forkd</a>
  <div class="nav-links">
    <a href="/discover" class="nav-link">Discover</a>
    <a href="/publish" class="nav-link">Publish</a>
    <a href="/changelog_generator.html" class="nav-link">Generator</a>
    <span id="auth-slot"></span>
  </div>
</div></nav>

<div class="container">
  <div id="loading"><div class="spinner"></div></div>

  <div id="notFound" class="hidden">
    <div class="empty-state" style="padding:4rem 2rem;">
      <div style="font-size:2rem;margin-bottom:.6rem;">?</div>
      <div style="font-weight:700;font-size:1rem;color:var(--text);margin-bottom:.4rem;">Project not found</div>
      <div style="margin-bottom:1.25rem;">No project exists at this URL yet.</div>
      <a href="/discover" class="btn btn-primary">Browse projects</a>
    </div>
  </div>

  <div id="projectView" class="hidden">
    <div class="project-header">
      <div id="projectLogo" class="project-logo">F</div>
      <div class="project-main">
        <div class="project-title-row">
          <h1 class="project-name" id="projectName">Project</h1>
          <span class="badge" id="projectCategory">Other</span>
          <span class="badge" id="projectClaimedBadge"></span>
        </div>
        <p class="project-desc" id="projectDesc"></p>
        <div class="project-meta" id="projectMeta"></div>
        <div class="tag-list" id="projectTags"></div>
      </div>
      <div class="project-actions">
        <button class="btn btn-primary" id="followBtn" onclick="toggleFollow()">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="23" y1="11" x2="17" y2="11"/></svg>
          <span id="followText">Follow</span>
        </button>
        <a class="btn btn-ghost" id="repoLink" target="_blank" rel="noopener" style="display:none;">Repository</a>
        <a class="btn btn-ghost" id="websiteLink" target="_blank" rel="noopener" style="display:none;">Website</a>
        <a class="btn btn-ghost" id="shareLink" href="#">Share</a>
      </div>
    </div>

    <div class="section-head">
      <h2>Releases</h2>
      <span class="sub" id="releaseCount"></span>
    </div>
    <div class="release-list" id="releaseList"></div>
  </div>
</div>

<footer><a href="/">Forkd</a> — publish, discover, and follow software changelogs</footer>
<div class="toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyBu1N-awPnUjXAVqzWtCyhxTDBC-4QPNak",
  authDomain: "changlelog-generator.firebaseapp.com",
  projectId: "changlelog-generator",
  storageBucket: "changlelog-generator.firebasestorage.app",
  messagingSenderId: "640801556466",
  appId: "1:640801556466:web:2bce80e0bab1021cc44d6b"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
let currentUser = null;

const slug = window.location.pathname.split('/').filter(Boolean).pop();

function esc(s){ const d=document.createElement('div'); d.textContent = s == null ? '' : String(s); return d.innerHTML; }
function timeAgo(d){
  if(!d) return '';
  const n = Date.now() - new Date(d).getTime(), m = Math.floor(n/60000);
  if (m < 1) return 'just now';
  if (m < 60) return m + 'm ago';
  const h = Math.floor(m/60); if (h < 24) return h + 'h ago';
  const days = Math.floor(h/24); if (days < 7) return days + 'd ago';
  return new Date(d).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
}
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(window._tt); window._tt=setTimeout(()=>t.classList.remove('show'),2200); }

auth.onAuthStateChanged(user => {
  currentUser = user || null;
  renderAuthSlot();
  if (user) checkFollowing();
});

function renderAuthSlot(){
  const slot = document.getElementById('auth-slot');
  if (currentUser) {
    slot.innerHTML = '<a href="/dashboard.html" class="nav-link">' + esc(currentUser.displayName || 'Dashboard') + '</a>';
  } else {
    slot.innerHTML = '<a href="/login.html" class="nav-link">Sign in</a>';
  }
}

async function loadProject(){
  if (!slug || slug === 'project.html') { showNotFound(); return; }
  try {
    const res = await fetch('/api/projects/' + encodeURIComponent(slug));
    if (!res.ok) { showNotFound(); return; }
    const data = await res.json();
    renderProject(data.project, data.releases || []);
  } catch (e) {
    console.error('Project load error', e);
    showNotFound();
  }
}

function showNotFound(){
  document.getElementById('loading').classList.add('hidden');
  document.getElementById('notFound').classList.remove('hidden');
}

function renderProject(project, releases){
  document.getElementById('loading').classList.add('hidden');
  document.getElementById('projectView').classList.remove('hidden');
  document.getElementById('projectName').textContent = project.name;
  document.getElementById('projectCategory').textContent = (project.category || 'other').replace(/-/g,' ').replace(/\b\w/g, c => c.toUpperCase());
  document.getElementById('projectDesc').textContent = project.description || 'No description provided yet.';

  const logo = document.getElementById('projectLogo');
  if (project.logoUrl) {
    logo.outerHTML = '<img class="project-logo" id="projectLogo" src="' + esc(project.logoUrl) + '" alt="' + esc(project.name) + ' logo" referrerpolicy="no-referrer"/>';
  } else {
    logo.textContent = (project.name || 'F').charAt(0).toUpperCase();
  }

  const claimedBadge = document.getElementById('projectClaimedBadge');
  if (project.claimed) {
    claimedBadge.className = 'badge verified';
    claimedBadge.textContent = 'Claimed by owner';
  } else {
    claimedBadge.className = 'badge imported';
    claimedBadge.textContent = 'Unclaimed';
  }

  const meta = [];
  meta.push('<span>' + releases.length + ' release' + (releases.length === 1 ? '' : 's') + '</span>');
  meta.push('<span>' + (project.followerCount || 0) + ' follower' + ((project.followerCount || 0) === 1 ? '' : 's') + '</span>');
  if (project.lastReleaseAt) meta.push('<span>Last release ' + timeAgo(project.lastReleaseAt) + '</span>');
  document.getElementById('projectMeta').innerHTML = meta.join('<span>·</span>');

  document.getElementById('projectTags').innerHTML = (project.tags || []).map(t => '<span class="tag">' + esc(t) + '</span>').join('');

  if (project.repoUrl) {
    const a = document.getElementById('repoLink');
    a.href = project.repoUrl; a.style.display = 'inline-flex';
  }
  if (project.websiteUrl) {
    const a = document.getElementById('websiteLink');
    a.href = project.websiteUrl; a.style.display = 'inline-flex';
  }
  document.getElementById('shareLink').href = 'https://forkd-ai.com/p/' + encodeURIComponent(project.slug);

  const list = document.getElementById('releaseList');
  document.getElementById('releaseCount').textContent = releases.length ? 'newest first' : '';
  if (!releases.length) {
    list.innerHTML = '<div class="empty-state">No releases published yet.<br/>Project owners can publish the first release from the <a href="/publish" style="color:var(--accent);">publish page</a>.</div>';
    return;
  }
  list.innerHTML = releases.map(r => {
    const badges = [];
    if (r.imported) badges.push('<span class="badge imported">Imported</span>');
    else if (r.source === 'forkd') badges.push('<span class="badge">Forkd draft</span>');
    return '<a class="release-item" href="/shared/' + encodeURIComponent(r.id) + '">' +
      '<div class="release-title">' + esc(r.title) + (r.version ? ' <span class="badge">' + esc(r.version) + '</span>' : '') + badges.join('') + '</div>' +
      '<div class="release-excerpt">' + esc(r.excerpt || '') + '</div>' +
      '<div class="release-meta">' +
        (r.version ? '<span class="ver">' + esc(r.version) + '</span><span>·</span>' : '') +
        '<span>' + timeAgo(r.createdAt) + '</span>' +
        '<span>·</span><span>' + esc(r.author) + '</span>' +
      '</div>' +
    '</a>';
  }).join('');
}

async function checkFollowing(){
  try {
    const token = await currentUser.getIdToken();
    const res = await fetch('/api/projects/' + encodeURIComponent(slug) + '/following/check', { headers: { Authorization: 'Bearer ' + token } });
    const data = await res.json();
    setFollowState(!!data.following);
  } catch (e) {}
}

function setFollowState(following){
  const btn = document.getElementById('followBtn');
  btn.classList.toggle('following', following);
  document.getElementById('followText').textContent = following ? 'Following' : 'Follow';
}

async function toggleFollow(){
  if (!currentUser) { window.location.href = '/login.html'; return; }
  try {
    const token = await currentUser.getIdToken();
    const following = document.getElementById('followBtn').classList.contains('following');
    const res = await fetch('/api/projects/' + encodeURIComponent(slug) + '/follow', {
      method: following ? 'DELETE' : 'POST',
      headers: { Authorization: 'Bearer ' + token },
    });
    if (res.status === 401) { window.location.href = '/login.html'; return; }
    if (!res.ok) { toast('Could not update follow. Try again.'); return; }
    const data = await res.json();
    setFollowState(!!data.following);
    toast(data.following ? 'Following ' + slug : 'Unfollowed ' + slug);
  } catch (e) {
    toast('Could not update follow. Try again.');
  }
}

document.addEventListener('DOMContentLoaded', loadProject);
</script>
</body>
</html>
