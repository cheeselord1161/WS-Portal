<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<!--FORKD_META-->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="icon" type="image/x-icon" href="favicon.ico">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#030305;--surface:#0a0a0e;--surface2:#111116;--surface3:#18181d;--border:rgba(255,255,255,0.07);--border-hover:rgba(255,255,255,0.14);--accent:#fff;--accent-dim:rgba(255,255,255,0.08);--text:#f0f0f0;--text-muted:#9999aa;--text-dim:#555;--danger:#ff4545;--success:#28c840;--warning:#f59e0b;--font-ui:'Inter',sans-serif;--font-mono:'SF Mono','Fira Code','IBM Plex Mono',monospace;--radius:8px;--radius-lg:12px;--radius-xl:16px}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:var(--font-ui);min-height:100vh}
body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(255,255,255,0.02) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,0.02) 1px,transparent 1px);background-size:56px 56px;pointer-events:none;z-index:0}
.glow-orb{position:fixed;border-radius:50%;filter:blur(100px);pointer-events:none;z-index:0;opacity:.6}
.glow-1{width:500px;height:500px;background:radial-gradient(circle,rgba(255,255,255,0.04) 0%,transparent 70%);top:-200px;left:-100px}
nav{display:flex;justify-content:center;padding:14px 20px;position:sticky;top:0;z-index:100;background:rgba(3,3,5,.85);backdrop-filter:blur(16px);border-bottom:1px solid var(--border)}
.nav-inner{width:100%;max-width:960px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.logo{display:flex;align-items:center;gap:10px;font-size:.95rem;font-weight:800;letter-spacing:-.03em;text-decoration:none;color:var(--text)}
.logo-img{height:22px;width:auto}
.nav-links{display:flex;align-items:center;gap:12px}
.nav-link{font-size:.82rem;font-weight:500;color:var(--text-muted);text-decoration:none;transition:color .15s}
.nav-link:hover{color:var(--text)}
.container{max-width:960px;margin:0 auto;padding:2rem;position:relative;z-index:1}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.loading-state{padding:4rem 2rem;display:flex;justify-content:center}
.spinner{width:24px;height:24px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.hidden{display:none!important}
.error-state{padding:4rem 2rem;text-align:center;border:1px dashed var(--border);border-radius:var(--radius-xl);font-family:var(--font-mono);font-size:.85rem;color:var(--text-muted)}
.org-view{animation:fadeUp .35s ease}
.org-header{display:flex;gap:1.25rem;align-items:flex-start;padding:1rem 0 1.5rem;flex-wrap:wrap}
.org-logo{width:72px;height:72px;border-radius:var(--radius-lg);border:1px solid var(--border);background:var(--surface2);object-fit:cover;display:flex;align-items:center;justify-content:center;font-size:1.7rem;font-weight:900;color:var(--accent);flex-shrink:0}
.org-main{flex:1;min-width:240px}
.org-title-row{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;margin-bottom:.4rem}
.org-name{font-size:clamp(1.5rem,3.5vw,2.1rem);font-weight:900;letter-spacing:-.04em;line-height:1.1}
.badge{font-family:var(--font-mono);font-size:.62rem;font-weight:600;padding:3px 8px;border-radius:5px;background:var(--accent-dim);color:var(--text-muted);border:1px solid var(--border);text-decoration:none;white-space:nowrap}
.badge.role{color:var(--success);border-color:rgba(40,200,64,.3);background:rgba(40,200,64,.08)}
.org-desc{font-size:.92rem;color:var(--text-muted);line-height:1.7;max-width:640px;margin-bottom:.85rem}
.org-meta{display:flex;align-items:center;gap:1rem;flex-wrap:wrap;font-family:var(--font-mono);font-size:.72rem;color:var(--text-dim)}
.org-meta a{color:var(--text-muted);text-decoration:none}
.org-meta a:hover{color:var(--accent);text-decoration:underline}
.tag-list{display:flex;gap:.4rem;flex-wrap:wrap;margin-top:.7rem}
.tag{font-family:var(--font-mono);font-size:.65rem;color:var(--text-dim);border:1px solid var(--border);border-radius:999px;padding:3px 9px}
.org-actions{display:flex;gap:.6rem;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;padding:.6rem 1.2rem;border-radius:var(--radius-lg);font-family:var(--font-ui);font-size:.82rem;font-weight:600;text-decoration:none;cursor:pointer;transition:all .15s;border:none}
.btn-primary{background:var(--accent);color:#030305}
.btn-primary:hover{transform:translateY(-1px)}
.btn-ghost{background:var(--surface2);color:var(--text-muted);border:1px solid var(--border)}
.btn-ghost:hover{color:var(--text);border-color:var(--border-hover)}
.following{border-color:var(--accent)!important;color:var(--accent)!important}
.columns{display:grid;grid-template-columns:1.6fr 1fr;gap:2rem;align-items:start}
@media(max-width:760px){.columns{grid-template-columns:1fr}}
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:1rem;border-top:1px solid var(--border);padding-top:1.5rem;margin-bottom:1rem;flex-wrap:wrap}
.section-head h2{font-size:1rem;font-weight:700}
.section-head .sub{font-family:var(--font-mono);font-size:.7rem;color:var(--text-dim)}
.card-list{display:flex;flex-direction:column;gap:.6rem}
.item{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-xl);padding:1rem 1.25rem;text-decoration:none;color:var(--text);display:block;transition:all .15s}
.item:hover{border-color:var(--border-hover);background:var(--surface2);transform:translateY(-1px)}
.item-top{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;margin-bottom:.3rem}
.item-title{font-size:.9rem;font-weight:700}
.item-excerpt{font-size:.8rem;color:var(--text-muted);line-height:1.6;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:.4rem}
.item-meta{font-family:var(--font-mono);font-size:.66rem;color:var(--text-dim);display:flex;gap:.6rem;flex-wrap:wrap}
.ver{font-family:var(--font-mono);font-size:.62rem;color:var(--text-muted);border:1px solid var(--border);border-radius:5px;padding:2px 6px}
.member{display:flex;align-items:center;gap:.6rem;padding:.5rem 0;border-bottom:1px solid var(--border);text-decoration:none;color:var(--text)}
.member:last-child{border-bottom:none}
.member-avatar{width:30px;height:30px;border-radius:50%;background:var(--surface2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:700;color:var(--accent);flex-shrink:0;object-fit:cover}
.member-name{font-size:.82rem;font-weight:600}
.member-handle{font-family:var(--font-mono);font-size:.65rem;color:var(--text-dim)}
.member-role{margin-left:auto;font-family:var(--font-mono);font-size:.6rem;text-transform:uppercase;letter-spacing:.06em;color:var(--text-dim)}
.empty-state{padding:2.5rem 1.5rem;text-align:center;font-family:var(--font-mono);font-size:.8rem;color:var(--text-dim);border:1px dashed var(--border);border-radius:var(--radius-xl)}
.toast{position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%);background:var(--surface2);border:1px solid var(--border-hover);color:var(--text);font-size:.8rem;padding:.7rem 1.2rem;border-radius:var(--radius-lg);z-index:200;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
footer{text-align:center;padding:2rem;font-family:var(--font-mono);font-size:.65rem;color:var(--text-dim);border-top:1px solid var(--border);margin-top:2rem;position:relative;z-index:1}
footer a{color:var(--text-muted);text-decoration:none}
</style>
<link rel="stylesheet" href="/forkd-theme.css">
</head>
<body>
<div class="glow-orb glow-1"></div>

<nav><div class="nav-inner">
  <a href="/" class="logo"><img src="logo.png" alt="" class="logo-img">Forkd</a>
  <div class="nav-links">
    <a href="/discover" class="nav-link">Discover</a>
    <a href="/publish" class="nav-link">Publish</a>
    <span id="auth-slot"></span>
  </div>
</div></nav>

<div class="container">
  <div class="loading-state" id="loadingState"><div class="spinner"></div></div>

  <div class="error-state hidden" id="errorState">
    <div style="font-size:1.6rem;margin-bottom:.6rem;">?</div>
    <div style="font-weight:700;font-size:1rem;color:var(--text);margin-bottom:.4rem;">Organization not found</div>
    <div style="margin-bottom:1.25rem;">No organization exists at this URL yet.</div>
    <a href="/publish" class="btn btn-primary">Create an organization</a>
  </div>

  <div class="org-view hidden" id="orgView">
    <div class="org-header">
      <div class="org-logo" id="orgLogo">O</div>
      <div class="org-main">
        <div class="org-title-row">
          <h1 class="org-name" id="orgName">Organization</h1>
          <span class="badge" id="orgCategory" style="display:none;"></span>
          <span class="badge role hidden" id="viewerRoleBadge"></span>
        </div>
        <p class="org-desc" id="orgDesc"></p>
        <div class="org-meta" id="orgMeta"></div>
        <div class="tag-list" id="orgTags"></div>
      </div>
      <div class="org-actions">
        <button class="btn btn-primary" id="followBtn" onclick="toggleFollow()">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="23" y1="11" x2="17" y2="11"/></svg>
          <span id="followText">Follow</span>
        </button>
        <a class="btn btn-ghost hidden" id="websiteLink" target="_blank" rel="noopener">Website</a>
        <a class="btn btn-ghost hidden" id="publishLink" href="/publish">Publish</a>
      </div>
    </div>

    <div class="columns">
      <div>
        <div class="section-head"><h2>Updates</h2><span class="sub" id="changelogCount"></span></div>
        <div class="card-list" id="changelogList"></div>
      </div>
      <div>
        <div class="section-head"><h2>Members</h2><span class="sub" id="memberCount"></span></div>
        <div id="membersList"></div>
      </div>
    </div>
  </div>
</div>

<footer><a href="/">Forkd</a> — publish, discover, and follow software changelogs</footer>
<div class="toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyBu1N-awPnUjXAVqzWtCyhxTDBC-4QPNak",
  authDomain: "changlelog-generator.firebaseapp.com",
  projectId: "changlelog-generator",
  storageBucket: "changlelog-generator.firebasestorage.app",
  messagingSenderId: "640801556466",
  appId: "1:640801556466:web:2bce80e0bab1021cc44d6b"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();

let currentUser = null;
let organization = null;
let isFollowing = false;
let slug = '';

function esc(s){ const d = document.createElement('div'); d.textContent = s == null ? '' : String(s); return d.innerHTML; }
function toast(msg){ const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(window._tt); window._tt = setTimeout(() => t.classList.remove('show'), 2200); }
function timeAgo(d){
  if (!d) return 'recently';
  const n = Date.now() - new Date(d).getTime(), m = Math.floor(n/60000);
  if (m < 1) return 'just now';
  if (m < 60) return m + 'm ago';
  const h = Math.floor(m/60); if (h < 24) return h + 'h ago';
  const days = Math.floor(h/24); if (days < 7) return days + 'd ago';
  return new Date(d).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
}

auth.onAuthStateChanged(user => {
  currentUser = user || null;
  renderAuthSlot();
  if (organization) refreshViewerState();
});

function renderAuthSlot(){
  const slot = document.getElementById('auth-slot');
  if (!slot) return;
  if (currentUser) slot.innerHTML = '<a href="/dashboard.html" class="nav-link">' + esc(currentUser.displayName || 'Dashboard') + '</a>';
  else slot.innerHTML = '<a href="/login.html" class="nav-link">Sign in</a>';
}

async function loadOrg(){
  slug = window.location.pathname.split('/').filter(Boolean).pop();
  if (!slug || slug === 'org.html') { showError(); return; }
  try {
    const res = await fetch('/api/orgs/' + encodeURIComponent(slug));
    if (!res.ok) { showError(); return; }
    const data = await res.json();
    organization = data.organization;
    isFollowing = !!data.isFollowing;
    render(data.members || [], data.changelogs || [], data.viewerRole);
  } catch (err) {
    showError();
  }
}

function showError(){
  document.getElementById('loadingState').classList.add('hidden');
  document.getElementById('errorState').classList.remove('hidden');
}

function render(members, changelogs, viewerRole){
  document.getElementById('loadingState').classList.add('hidden');
  document.getElementById('orgView').classList.remove('hidden');
  document.title = organization.name + ' · Forkd';

  const logo = document.getElementById('orgLogo');
  if (organization.avatarUrl) {
    logo.outerHTML = '<img class="org-logo" id="orgLogo" src="' + esc(organization.avatarUrl) + '" alt="" referrerpolicy="no-referrer"/>';
  } else {
    logo.textContent = (organization.name || 'O').charAt(0).toUpperCase();
  }

  document.getElementById('orgName').textContent = organization.name;
  document.getElementById('orgDesc').textContent = organization.description || 'No description provided yet.';

  const category = document.getElementById('orgCategory');
  if (organization.category && organization.category !== 'other') {
    category.style.display = '';
    category.textContent = String(organization.category).replace(/-/g, ' ');
  }

  const meta = [];
  meta.push('<span>' + (organization.followerCount || 0) + ' follower' + ((organization.followerCount || 0) === 1 ? '' : 's') + '</span>');
  meta.push('<span>' + (organization.changelogCount || changelogs.length) + ' update' + ((organization.changelogCount || changelogs.length) === 1 ? '' : 's') + '</span>');
  if (organization.lastReleaseAt) meta.push('<span>Last update ' + timeAgo(organization.lastReleaseAt) + '</span>');
  document.getElementById('orgMeta').innerHTML = meta.join('<span>·</span>');

  document.getElementById('orgTags').innerHTML = (organization.tags || []).map(t => '<span class="tag">' + esc(t) + '</span>').join('');

  if (organization.websiteUrl) {
    const link = document.getElementById('websiteLink');
    link.href = organization.websiteUrl;
    link.classList.remove('hidden');
  }

  setFollowState(isFollowing);
  applyViewerRole(viewerRole);

  document.getElementById('changelogCount').textContent = changelogs.length ? 'newest first' : '';
  const list = document.getElementById('changelogList');
  if (!changelogs.length) {
    list.innerHTML = '<div class="empty-state">No updates published yet.</div>';
  } else {
    list.innerHTML = changelogs.map(c => {
      const href = '/changelog/' + encodeURIComponent(c.slug || c.id);
      return '<a class="item" href="' + href + '">' +
        '<div class="item-top"><span class="item-title">' + esc(c.title) + '</span>' +
          (c.version ? '<span class="ver">' + esc(c.version) + '</span>' : '') +
          (c.imported ? '<span class="ver">imported</span>' : '') + '</div>' +
        '<div class="item-excerpt">' + esc(c.excerpt || '') + '</div>' +
        '<div class="item-meta"><span>' + timeAgo(c.publishedAt || c.createdAt) + '</span><span>·</span><span>' + esc(c.author) + '</span></div>' +
      '</a>';
    }).join('');
  }

  document.getElementById('memberCount').textContent = members.length + (members.length === 1 ? ' member' : ' members');
  const memberList = document.getElementById('membersList');
  if (!members.length) {
    memberList.innerHTML = '<div class="empty-state">No members yet.</div>';
  } else {
    memberList.innerHTML = members.map(m => {
      const avatar = m.photoURL
        ? '<img class="member-avatar" src="' + esc(m.photoURL) + '" alt="" referrerpolicy="no-referrer"/>'
        : '<div class="member-avatar">' + esc((m.displayName || 'M').charAt(0).toUpperCase()) + '</div>';
      const inner = avatar + '<div><div class="member-name">' + esc(m.displayName) + '</div>' +
        (m.username ? '<div class="member-handle">@' + esc(m.username) + '</div>' : '') + '</div>' +
        '<span class="member-role">' + esc(m.role) + '</span>';
      return m.username
        ? '<a class="member" href="/@' + encodeURIComponent(m.username) + '">' + inner + '</a>'
        : '<div class="member">' + inner + '</div>';
    }).join('');
  }
}

function applyViewerRole(viewerRole){
  const badge = document.getElementById('viewerRoleBadge');
  const publishLink = document.getElementById('publishLink');
  if (!viewerRole) { badge.classList.add('hidden'); publishLink.classList.add('hidden'); return; }
  badge.classList.remove('hidden');
  badge.textContent = 'You are ' + viewerRole;
  publishLink.classList.remove('hidden');
  publishLink.href = '/publish?org=' + encodeURIComponent(slug);
}

async function refreshViewerState(){
  if (!currentUser || !slug) return;
  try {
    const token = await currentUser.getIdToken();
    const res = await fetch('/api/orgs/' + encodeURIComponent(slug), { headers: { Authorization: 'Bearer ' + token } });
    if (!res.ok) return;
    const data = await res.json();
    isFollowing = !!data.isFollowing;
    setFollowState(isFollowing);
    applyViewerRole(data.viewerRole);
  } catch (e) { /* viewer-only enhancement */ }
}

function setFollowState(following){
  isFollowing = following;
  const btn = document.getElementById('followBtn');
  btn.classList.toggle('following', following);
  document.getElementById('followText').textContent = following ? 'Following' : 'Follow';
}

async function toggleFollow(){
  if (!currentUser) { window.location.href = '/login.html'; return; }
  try {
    const token = await currentUser.getIdToken();
    const res = await fetch('/api/orgs/' + encodeURIComponent(slug) + '/follow', {
      method: isFollowing ? 'DELETE' : 'POST',
      headers: { Authorization: 'Bearer ' + token },
    });
    if (res.status === 401) { window.location.href = '/login.html'; return; }
    if (!res.ok) { toast('Could not update follow. Try again.'); return; }
    const data = await res.json();
    setFollowState(!!data.following);
    toast(data.following ? 'Following ' + organization.name : 'Unfollowed ' + organization.name);
  } catch (e) { toast('Could not update follow. Try again.'); }
}

document.addEventListener('DOMContentLoaded', loadOrg);
</script>
</body>
</html>
