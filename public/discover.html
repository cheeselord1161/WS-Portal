<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Discover software releases — Forkd</title>
<meta name="description" content="Browse recently published software changelogs and discover the creators and organizations shipping new developer tools, CLI apps, libraries and open-source projects on Forkd."/>
<link rel="canonical" href="https://forkd-ai.com/discover"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="icon" type="image/x-icon" href="favicon.ico">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#030305;--surface:#0a0a0e;--surface2:#111116;--surface3:#18181d;--border:rgba(255,255,255,0.07);--border-hover:rgba(255,255,255,0.14);--accent:#fff;--accent-dim:rgba(255,255,255,0.08);--text:#f0f0f0;--text-muted:#9999aa;--text-dim:#555;--danger:#ff4545;--success:#28c840;--warning:#f59e0b;--font-ui:'Inter',sans-serif;--font-mono:'SF Mono','Fira Code','IBM Plex Mono',monospace;--radius:8px;--radius-lg:12px;--radius-xl:16px}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:var(--font-ui);min-height:100vh}
body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(255,255,255,0.02) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,0.02) 1px,transparent 1px);background-size:56px 56px;pointer-events:none;z-index:0}
.glow-orb{position:fixed;border-radius:50%;filter:blur(100px);pointer-events:none;z-index:0;opacity:.6}
.glow-1{width:500px;height:500px;background:radial-gradient(circle,rgba(255,255,255,0.04) 0%,transparent 70%);top:-200px;left:-100px}
nav{display:flex;justify-content:center;padding:14px 20px;position:sticky;top:0;z-index:100;background:rgba(3,3,5,.85);backdrop-filter:blur(16px);border-bottom:1px solid var(--border)}
.nav-inner{width:100%;max-width:1060px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.logo{display:flex;align-items:center;gap:10px;font-size:.95rem;font-weight:800;letter-spacing:-.03em;text-decoration:none;color:var(--text)}
.logo-img{height:22px;width:auto}
.nav-links{display:flex;align-items:center;gap:12px}
.nav-link{font-size:.82rem;font-weight:500;color:var(--text-muted);text-decoration:none;transition:color .15s}
.nav-link:hover{color:var(--text)}
.container{max-width:1060px;margin:0 auto;padding:2rem;position:relative;z-index:1}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.page-head{padding:2rem 0 1.25rem;animation:fadeUp .35s ease}
.page-head h1{font-size:clamp(1.7rem,4vw,2.4rem);font-weight:900;letter-spacing:-.04em;margin-bottom:.5rem}
.page-head p{font-size:.92rem;color:var(--text-muted);max-width:600px;line-height:1.7}
.controls{display:flex;flex-direction:column;gap:.9rem;margin:1.25rem 0 1.5rem}
.search-bar{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:9px 14px;width:100%;max-width:440px;transition:border-color .15s}
.search-bar:focus-within{border-color:var(--border-hover)}
.search-bar input{background:none;border:none;outline:none;color:var(--text);font-size:.85rem;width:100%;font-family:var(--font-ui)}
.search-bar input::placeholder{color:var(--text-dim)}
.chip-row{display:flex;gap:.5rem;flex-wrap:wrap}
.chip{font-family:var(--font-mono);font-size:.7rem;color:var(--text-muted);background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:5px 12px;cursor:pointer;transition:all .15s}
.chip:hover{color:var(--text);border-color:var(--border-hover)}
.chip.active{background:var(--accent);color:#030305;border-color:var(--accent);font-weight:600}
.tabs{display:flex;gap:.25rem;border-bottom:1px solid var(--border);margin-bottom:1.5rem}
.tab{font-size:.85rem;font-weight:600;color:var(--text-muted);background:none;border:none;padding:.7rem 1rem;cursor:pointer;border-bottom:2px solid transparent;transition:all .15s;font-family:var(--font-ui)}
.tab:hover{color:var(--text)}
.tab.active{color:var(--text);border-bottom-color:var(--accent)}
.list{display:flex;flex-direction:column;gap:.6rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:.85rem}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-xl);padding:1.15rem 1.35rem;text-decoration:none;color:var(--text);display:flex;gap:1.25rem;align-items:center;justify-content:space-between;transition:all .15s}
.card:hover{border-color:var(--border-hover);background:var(--surface2);transform:translateY(-1px)}
.card-main{flex:1;min-width:0}
.card-top{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;margin-bottom:.35rem}
.card-owner{font-size:.72rem;font-weight:700;color:var(--accent);text-decoration:none}
.card-ver{font-family:var(--font-mono);font-size:.62rem;color:var(--text-muted);border:1px solid var(--border);border-radius:5px;padding:2px 6px}
.card-title{font-size:.92rem;font-weight:700;margin-bottom:.2rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-excerpt{font-size:.8rem;color:var(--text-muted);line-height:1.55;margin-bottom:.4rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-meta{display:flex;gap:.65rem;flex-wrap:wrap;font-family:var(--font-mono);font-size:.66rem;color:var(--text-dim)}
.pill-org{font-family:var(--font-mono);font-size:.6rem;color:var(--success);border:1px solid rgba(40,200,64,.3);border-radius:4px;padding:2px 6px}
.card-stats{display:flex;gap:.85rem;flex-shrink:0;font-family:var(--font-mono);font-size:.7rem;color:var(--text-dim)}
.person{display:flex;align-items:center;gap:.85rem}
.avatar{width:44px;height:44px;border-radius:50%;background:var(--surface2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--accent);flex-shrink:0;object-fit:cover}
.avatar.square{border-radius:12px}
.empty-state{padding:3rem 2rem;text-align:center;font-family:var(--font-mono);font-size:.82rem;color:var(--text-dim);border:1px dashed var(--border);border-radius:var(--radius-xl)}
.load-more{display:flex;justify-content:center;margin-top:1.25rem}
.btn{display:inline-flex;align-items:center;gap:8px;padding:.6rem 1.25rem;border-radius:var(--radius-lg);font-family:var(--font-ui);font-size:.82rem;font-weight:600;text-decoration:none;cursor:pointer;transition:all .15s;border:none}
.btn-primary{background:var(--accent);color:#030305}
.btn-ghost{background:var(--surface2);color:var(--text-muted);border:1px solid var(--border)}
.btn-ghost:hover{color:var(--text);border-color:var(--border-hover)}
.spinner{width:22px;height:22px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;margin:2.5rem auto}
@keyframes spin{to{transform:rotate(360deg)}}
.hidden{display:none!important}
footer{text-align:center;padding:2rem;font-family:var(--font-mono);font-size:.65rem;color:var(--text-dim);border-top:1px solid var(--border);margin-top:2rem;position:relative;z-index:1}
footer a{color:var(--text-muted);text-decoration:none}
@media(max-width:640px){.container{padding:1rem}.card{flex-direction:column;align-items:flex-start;gap:.5rem}.grid{grid-template-columns:1fr}}
</style>
<link rel="stylesheet" href="/forkd-theme.css">
</head>
<body>
<div class="glow-orb glow-1"></div>

<nav><div class="nav-inner">
  <a href="/" class="logo"><img src="logo.png" alt="" class="logo-img">Forkd</a>
  <div class="nav-links">
    <a href="/discover" class="nav-link" style="color:var(--text);">Discover</a>
    <a href="/publish" class="nav-link">Publish</a>
    <a href="/changelog_generator.html" class="nav-link">Generator</a>
    <span id="auth-slot"></span>
  </div>
</div></nav>

<div class="container">
  <div class="page-head">
    <h1>Discover software updates</h1>
    <p>Recently published changelogs from creators and organizations on Forkd. Follow the people and teams you rely on to keep up with what ships next.</p>
  </div>

  <div class="controls">
    <div class="search-bar">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--text-dim)" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" id="searchInput" placeholder="Search changelogs, creators, organizations…" aria-label="Search"/>
    </div>
    <div class="chip-row" id="categoryChips"></div>
  </div>

  <div class="tabs" role="tablist">
    <button class="tab active" id="tabChangelogs" role="tab" onclick="setView('changelogs')">Changelogs</button>
    <button class="tab" id="tabOrganizations" role="tab" onclick="setView('organizations')">Organizations</button>
    <button class="tab" id="tabPeople" role="tab" onclick="setView('people')">People</button>
  </div>

  <div id="viewChangelogs"><div class="spinner"></div></div>
  <div id="viewOrganizations" class="hidden"></div>
  <div id="viewPeople" class="hidden"></div>
</div>

<footer><a href="/">Forkd</a> — publish, discover, and follow software changelogs</footer>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyBu1N-awPnUjXAVqzWtCyhxTDBC-4QPNak",
  authDomain: "changlelog-generator.firebaseapp.com",
  projectId: "changlelog-generator",
  storageBucket: "changlelog-generator.firebasestorage.app",
  messagingSenderId: "640801556466",
  appId: "1:640801556466:web:2bce80e0bab1021cc44d6b"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
auth.onAuthStateChanged(user => {
  const slot = document.getElementById('auth-slot');
  if (!slot) return;
  slot.innerHTML = user
    ? '<a href="/dashboard.html" class="nav-link">' + esc(user.displayName || 'Dashboard') + '</a>'
    : '<a href="/login.html" class="nav-link">Sign in</a>';
});

var state = { view: 'changelogs', category: 'all', q: '', cursor: null, done: false };
var PAGE_SIZE = 20;
var loading = false;

function esc(s){ const d = document.createElement('div'); d.textContent = s == null ? '' : String(s); return d.innerHTML; }
function timeAgo(d){
  if (!d) return 'recently';
  const n = Date.now() - new Date(d).getTime(), m = Math.floor(n/60000);
  if (m < 1) return 'just now';
  if (m < 60) return m + 'm ago';
  const h = Math.floor(m/60); if (h < 24) return h + 'h ago';
  const days = Math.floor(h/24); if (days < 7) return days + 'd ago';
  return new Date(d).toLocaleDateString('en-US',{month:'short',day:'numeric'});
}

function syncUrl(){
  const params = new URLSearchParams();
  if (state.category !== 'all') params.set('category', state.category);
  if (state.q) params.set('q', state.q);
  if (state.view !== 'changelogs') params.set('view', state.view);
  const qs = params.toString();
  history.replaceState(null, '', qs ? '/discover?' + qs : '/discover');
}

function setView(view){
  state.view = view;
  document.getElementById('tabChangelogs').classList.toggle('active', view === 'changelogs');
  document.getElementById('tabOrganizations').classList.toggle('active', view === 'organizations');
  document.getElementById('tabPeople').classList.toggle('active', view === 'people');
  document.getElementById('viewChangelogs').classList.toggle('hidden', view !== 'changelogs');
  document.getElementById('viewOrganizations').classList.toggle('hidden', view !== 'organizations');
  document.getElementById('viewPeople').classList.toggle('hidden', view !== 'people');
  resetAndLoad();
}

function selectCategory(id){
  state.category = id;
  document.querySelectorAll('#categoryChips .chip').forEach(c => c.classList.toggle('active', c.dataset.cat === id));
  resetAndLoad();
}

function resetAndLoad(){
  state.cursor = null;
  state.done = false;
  syncUrl();
  const container = document.getElementById(state.view === 'changelogs' ? 'viewChangelogs' : state.view === 'organizations' ? 'viewOrganizations' : 'viewPeople');
  container.innerHTML = '<div class="spinner"></div>';
  load();
}

async function loadCategories(){
  try {
    const res = await fetch('/api/categories');
    const data = await res.json();
    const chips = document.getElementById('categoryChips');
    const used = (data.categories || []).filter(c => (c.changelogCount || 0) > 0 || c.projectCount > 0);
    chips.innerHTML = '<button class="chip" data-cat="all">All categories</button>' +
      used.map(c => '<button class="chip" data-cat="' + c.id + '">' + esc(c.label) + '</button>').join('');
    chips.querySelectorAll('.chip').forEach(chip => chip.addEventListener('click', () => selectCategory(chip.dataset.cat)));
    document.querySelectorAll('#categoryChips .chip').forEach(c => c.classList.toggle('active', c.dataset.cat === state.category));
  } catch (e) { /* chips optional */ }
}

async function load(){
  if (loading || state.done) return;
  loading = true;
  const containerId = state.view === 'changelogs' ? 'viewChangelogs' : state.view === 'organizations' ? 'viewOrganizations' : 'viewPeople';
  const container = document.getElementById(containerId);

  try {
    if (state.view === 'changelogs') await loadChangelogs(container);
    else if (state.view === 'organizations') await loadOrganizations(container);
    else await loadPeople(container);
  } catch (e) {
    container.innerHTML = '<div class="empty-state">Could not load results. Please try again.<div style="margin-top:1.25rem;"><button class="btn btn-ghost" onclick="resetAndLoad()">Retry</button></div></div>';
    state.done = true;
  } finally {
    loading = false;
    renderLoadMore();
  }
}

async function loadChangelogs(container){
  const params = new URLSearchParams({ limit: String(PAGE_SIZE) });
  if (state.category !== 'all') params.set('category', state.category);
  if (state.q) params.set('q', state.q);
  if (state.cursor) params.set('cursor', state.cursor);

  const res = await fetch('/api/changelogs?' + params.toString());
  const data = await res.json();
  const items = data.items || [];
  const list = ensureList(container, 'list');
  if (!items.length && !state.cursor) { empty(container, 'No changelogs match this search yet.<br/>Try another category or clear the search.'); state.done = true; return; }
  const html = items.map(changelogCard).join('');
  if (list.dataset.rendered) list.insertAdjacentHTML('beforeend', html);
  else { list.innerHTML = html; list.dataset.rendered = '1'; }
  if (!data.nextCursor) state.done = true;
  state.cursor = data.nextCursor || null;
}

async function loadOrganizations(container){
  const params = new URLSearchParams({ limit: String(PAGE_SIZE) });
  if (state.category !== 'all') params.set('category', state.category);
  if (state.q) params.set('q', state.q);
  if (state.cursor) params.set('cursor', state.cursor);

  const res = await fetch('/api/orgs?' + params.toString());
  const data = await res.json();
  const items = data.items || [];
  const list = ensureList(container, 'grid');
  if (!items.length && !state.cursor) { empty(container, 'No organizations yet. Create one from the publish page.'); state.done = true; return; }
  const html = items.map(orgCard).join('');
  if (list.dataset.rendered) list.insertAdjacentHTML('beforeend', html);
  else { list.innerHTML = html; list.dataset.rendered = '1'; }
  if (!data.nextCursor) state.done = true;
  state.cursor = data.nextCursor || null;
}

async function loadPeople(container){
  if (!state.q) { empty(container, 'Search for a creator by name or @username.'); state.done = true; return; }
  const res = await fetch('/api/search?type=users&q=' + encodeURIComponent(state.q));
  const data = await res.json();
  const items = data.users || [];
  if (!items.length) { empty(container, 'No creators match this search.'); state.done = true; return; }
  container.innerHTML = '<div class="grid">' + items.map(personCard).join('') + '</div>';
  state.done = true;
}

function ensureList(container, className){
  let list = container.querySelector('.items');
  if (!list) {
    const emptyBox = container.querySelector('.empty-state');
    if (emptyBox) emptyBox.remove();
    list = document.createElement('div');
    list.className = className + ' items';
    container.appendChild(list);
  }
  return list;
}

function empty(container, msg){
  container.innerHTML = '<div class="empty-state">' + msg + '<div style="margin-top:1.25rem;"><a class="btn btn-primary" href="/publish">Publish a changelog</a></div></div>';
}

function changelogCard(r){
  const owner = r.orgSlug
    ? '<a class="card-owner" href="/org/' + encodeURIComponent(r.orgSlug) + '">' + esc(r.orgName || r.orgSlug) + '</a>'
    : (r.authorUsername
        ? '<a class="card-owner" href="/@' + encodeURIComponent(r.authorUsername) + '">' + esc(r.author) + '</a>'
        : '<span class="card-owner">' + esc(r.author) + '</span>');
  const href = r.slug ? '/changelog/' + encodeURIComponent(r.slug) : '/shared/' + encodeURIComponent(r.id);
  const badge = r.orgSlug ? '<span class="pill-org">organization</span>' : '';
  return '<a class="card" href="' + href + '">' +
    '<div class="card-main">' +
      '<div class="card-top">' + owner + (r.version ? '<span class="card-ver">' + esc(r.version) + '</span>' : '') + badge + '</div>' +
      '<div class="card-title">' + esc(r.title) + '</div>' +
      '<div class="card-excerpt">' + esc(r.excerpt || '') + '</div>' +
      '<div class="card-meta"><span>' + timeAgo(r.publishedAt || r.createdAt) + '</span></div>' +
    '</div>' +
    '<div class="card-stats"><span>' + (r.stars || 0) + ' ★</span><span>' + (r.views || 0) + ' views</span></div>' +
  '</a>';
}

function orgCard(o){
  const avatar = o.avatarUrl
    ? '<img class="avatar square" src="' + esc(o.avatarUrl) + '" alt="" referrerpolicy="no-referrer"/>'
    : '<div class="avatar square">' + esc((o.name || 'O').charAt(0).toUpperCase()) + '</div>';
  return '<a class="card person" href="/org/' + encodeURIComponent(o.slug) + '">' + avatar +
    '<div class="card-main"><div class="card-title">' + esc(o.name) + '</div>' +
    '<div class="card-meta">' + (o.followerCount || 0) + ' followers · ' + (o.changelogCount || 0) + ' updates</div></div>' +
  '</a>';
}

function personCard(p){
  const avatar = p.photoURL
    ? '<img class="avatar" src="' + esc(p.photoURL) + '" alt="" referrerpolicy="no-referrer"/>'
    : '<div class="avatar">' + esc((p.displayName || 'A').charAt(0).toUpperCase()) + '</div>';
  const href = p.username ? '/@' + encodeURIComponent(p.username) : '/u/' + encodeURIComponent(p.uid);
  return '<a class="card person" href="' + href + '">' + avatar +
    '<div class="card-main"><div class="card-title">' + esc(p.displayName) + '</div>' +
    '<div class="card-meta">' + (p.username ? '@' + esc(p.username) : '') + '</div></div>' +
  '</a>';
}

function renderLoadMore(){
  document.querySelectorAll('.load-more').forEach(el => el.remove());
  if (state.done || state.view === 'people') return;
  const container = document.getElementById(state.view === 'changelogs' ? 'viewChangelogs' : 'viewOrganizations');
  const wrap = document.createElement('div');
  wrap.className = 'load-more';
  wrap.innerHTML = '<button class="btn btn-ghost" onclick="load()">Load more</button>';
  container.appendChild(wrap);
}

function debounce(fn, ms){ let t; return function(){ clearTimeout(t); t = setTimeout(fn, ms); }; }

document.getElementById('searchInput').addEventListener('input', debounce(function(e){
  state.q = e.target.value.trim();
  resetAndLoad();
}, 300));

(function init(){
  const params = new URLSearchParams(location.search);
  state.category = params.get('category') || 'all';
  state.q = params.get('q') || '';
  state.view = ['organizations', 'people'].includes(params.get('view')) ? params.get('view') : 'changelogs';
  document.getElementById('searchInput').value = state.q;
  document.getElementById('tabChangelogs').classList.toggle('active', state.view === 'changelogs');
  document.getElementById('tabOrganizations').classList.toggle('active', state.view === 'organizations');
  document.getElementById('tabPeople').classList.toggle('active', state.view === 'people');
  document.getElementById('viewChangelogs').classList.toggle('hidden', state.view !== 'changelogs');
  document.getElementById('viewOrganizations').classList.toggle('hidden', state.view !== 'organizations');
  document.getElementById('viewPeople').classList.toggle('hidden', state.view !== 'people');
  loadCategories().then(load);
})();
</script>
</body>
</html>
