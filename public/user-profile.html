<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<!--FORKD_META-->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="icon" type="image/x-icon" href="favicon.ico">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#030305;--surface:#0a0a0e;--surface2:#111116;--surface3:#18181d;--border:rgba(255,255,255,0.07);--border-hover:rgba(255,255,255,0.14);--accent:#fff;--accent-dim:rgba(255,255,255,0.08);--text:#f0f0f0;--text-muted:#9999aa;--text-dim:#555;--danger:#ff4545;--success:#28c840;--font-ui:'Inter',sans-serif;--font-mono:'SF Mono','Fira Code','IBM Plex Mono',monospace;--radius:8px;--radius-lg:12px;--radius-xl:16px}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:var(--font-ui);min-height:100vh}
body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(255,255,255,0.02) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,0.02) 1px,transparent 1px);background-size:56px 56px;pointer-events:none;z-index:0}
.glow-orb{position:fixed;border-radius:50%;filter:blur(100px);pointer-events:none;z-index:0;opacity:.6}
.glow-1{width:420px;height:420px;background:radial-gradient(circle,rgba(255,255,255,0.04) 0%,transparent 70%);top:-160px;left:-90px}
nav{display:flex;justify-content:center;padding:14px 20px;position:sticky;top:0;z-index:100;background:rgba(3,3,5,.85);backdrop-filter:blur(16px);border-bottom:1px solid var(--border)}
.nav-inner{width:100%;max-width:860px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.logo{display:flex;align-items:center;gap:10px;font-size:.95rem;font-weight:800;letter-spacing:-.03em;text-decoration:none;color:var(--text)}
.logo-img{height:22px;width:auto}
.nav-links{display:flex;align-items:center;gap:12px}
.nav-link{font-size:.82rem;font-weight:500;color:var(--text-muted);text-decoration:none;transition:color .15s}
.nav-link:hover{color:var(--text)}
.container{max-width:860px;margin:0 auto;padding:2rem;position:relative;z-index:1}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.loading-state{padding:4rem 2rem;display:flex;justify-content:center}
.spinner{width:24px;height:24px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.hidden{display:none!important}
.error-state{padding:4rem 2rem;text-align:center;border:1px dashed var(--border);border-radius:var(--radius-xl);font-family:var(--font-mono);font-size:.85rem;color:var(--text-muted)}
.profile-view{animation:fadeUp .35s ease}
.profile-header{display:flex;align-items:center;gap:1.5rem;padding:1.5rem 0 1.75rem;flex-wrap:wrap}
.profile-avatar{width:76px;height:76px;border-radius:50%;object-fit:cover;border:1px solid var(--border);background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:1.7rem;font-weight:800;color:var(--accent);flex-shrink:0}
.profile-info{flex:1;min-width:220px}
.profile-name{font-size:clamp(1.4rem,3.5vw,1.9rem);font-weight:900;letter-spacing:-.03em;margin-bottom:.15rem}
.profile-handle{font-family:var(--font-mono);font-size:.78rem;color:var(--text-dim);margin-bottom:.5rem}
.profile-bio{font-size:.86rem;color:var(--text-muted);line-height:1.65;max-width:460px}
.profile-links{display:flex;gap:.6rem;flex-wrap:wrap;margin-top:.7rem}
.profile-links a{font-family:var(--font-mono);font-size:.68rem;color:var(--text-muted);text-decoration:none;border:1px solid var(--border);border-radius:999px;padding:3px 10px}
.profile-links a:hover{color:var(--accent);border-color:var(--border-hover)}
.profile-actions{display:flex;gap:.6rem;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;padding:.6rem 1.2rem;border-radius:var(--radius-lg);font-family:var(--font-ui);font-size:.82rem;font-weight:600;text-decoration:none;cursor:pointer;transition:all .15s;border:none}
.btn-primary{background:var(--accent);color:#030305}
.btn-primary:hover{transform:translateY(-1px)}
.btn-ghost{background:var(--surface2);color:var(--text-muted);border:1px solid var(--border)}
.btn-ghost:hover{color:var(--text);border-color:var(--border-hover)}
.following{border-color:var(--accent)!important;color:var(--accent)!important}
.stats{display:flex;gap:1.75rem;padding:1.25rem 0;border-top:1px solid var(--border);border-bottom:1px solid var(--border);flex-wrap:wrap;margin-bottom:1.5rem}
.stat{font-family:var(--font-mono);font-size:.72rem;color:var(--text-dim)}
.stat strong{display:block;font-size:1.25rem;font-family:var(--font-ui);color:var(--text);font-weight:800}
.tabs{display:flex;gap:.25rem;border-bottom:1px solid var(--border);margin-bottom:1.25rem}
.tab{font-size:.85rem;font-weight:600;color:var(--text-muted);background:none;border:none;padding:.7rem 1rem;cursor:pointer;border-bottom:2px solid transparent;transition:all .15s;font-family:var(--font-ui)}
.tab:hover{color:var(--text)}
.tab.active{color:var(--text);border-bottom-color:var(--accent)}
.card-list{display:flex;flex-direction:column;gap:.6rem}
.item{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-xl);padding:1rem 1.25rem;text-decoration:none;color:var(--text);display:block;transition:all .15s}
.item:hover{border-color:var(--border-hover);background:var(--surface2);transform:translateY(-1px)}
.item-top{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;margin-bottom:.3rem}
.item-title{font-size:.9rem;font-weight:700}
.item-excerpt{font-size:.8rem;color:var(--text-muted);line-height:1.6;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:.4rem}
.item-meta{font-family:var(--font-mono);font-size:.66rem;color:var(--text-dim);display:flex;gap:.6rem;flex-wrap:wrap}
.ver{font-family:var(--font-mono);font-size:.62rem;color:var(--text-muted);border:1px solid var(--border);border-radius:5px;padding:2px 6px}
.empty-state{padding:2.5rem 1.5rem;text-align:center;font-family:var(--font-mono);font-size:.8rem;color:var(--text-dim);border:1px dashed var(--border);border-radius:var(--radius-xl)}
.toast{position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%);background:var(--surface2);border:1px solid var(--border-hover);color:var(--text);font-size:.8rem;padding:.7rem 1.2rem;border-radius:var(--radius-lg);z-index:200;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
footer{text-align:center;padding:2rem;font-family:var(--font-mono);font-size:.65rem;color:var(--text-dim);border-top:1px solid var(--border);margin-top:2rem;position:relative;z-index:1}
footer a{color:var(--text-muted);text-decoration:none}
@media(max-width:640px){.container{padding:1rem}.profile-header{flex-direction:column;text-align:center;align-items:center}.stats{justify-content:center}.profile-actions{width:100%}.profile-actions .btn{flex:1;justify-content:center}}
</style>
<link rel="stylesheet" href="/forkd-theme.css">
</head>
<body>
<div class="glow-orb glow-1"></div>

<nav><div class="nav-inner">
  <a href="/" class="logo"><img src="logo.png" alt="" class="logo-img">Forkd</a>
  <div class="nav-links">
    <a href="/discover" class="nav-link">Discover</a>
    <a href="/publish" class="nav-link">Publish</a>
    <span id="auth-slot"></span>
  </div>
</div></nav>

<div class="container">
  <div class="loading-state" id="loadingState"><div class="spinner"></div></div>

  <div class="error-state hidden" id="errorState">
    <div style="font-size:1.6rem;margin-bottom:.6rem;">?</div>
    <div style="font-weight:700;font-size:1rem;color:var(--text);margin-bottom:.4rem;">Profile not found</div>
    <div style="margin-bottom:1.25rem;">No creator exists at this URL yet.</div>
    <a href="/discover" class="btn btn-primary">Browse creators</a>
  </div>

  <div class="profile-view hidden" id="profileView">
    <div class="profile-header">
      <div class="profile-avatar" id="profileAvatar">A</div>
      <div class="profile-info">
        <div class="profile-name" id="profileName">Anonymous</div>
        <div class="profile-handle" id="profileHandle"></div>
        <div class="profile-bio" id="profileBio"></div>
        <div class="profile-links" id="profileLinks"></div>
      </div>
      <div class="profile-actions">
        <button class="btn btn-primary" id="followBtn" onclick="toggleFollow()">
          <span id="followText">Follow</span>
        </button>
        <a class="btn btn-ghost hidden" id="rssLink" target="_blank" rel="noopener">RSS</a>
      </div>
    </div>

    <div class="stats" id="profileStats"></div>

    <div class="tabs">
      <button class="tab active" id="tabChangelogs" onclick="setTab('changelogs')">Changelogs</button>
      <button class="tab" id="tabOrganizations" onclick="setTab('organizations')">Organizations</button>
    </div>

    <div id="panelChangelogs"><div class="card-list" id="changelogList"></div></div>
    <div id="panelOrganizations" class="hidden"><div class="card-list" id="orgList"></div></div>
  </div>
</div>

<footer><a href="/">Forkd</a> — publish, discover, and follow software changelogs</footer>
<div class="toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyBu1N-awPnUjXAVqzWtCyhxTDBC-4QPNak",
  authDomain: "changlelog-generator.firebaseapp.com",
  projectId: "changlelog-generator",
  storageBucket: "changlelog-generator.firebasestorage.app",
  messagingSenderId: "640801556466",
  appId: "1:640801556466:web:2bce80e0bab1021cc44d6b"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();

let currentUser = null;
let profileUid = null;
let isFollowing = false;

function esc(s){ const d = document.createElement('div'); d.textContent = s == null ? '' : String(s); return d.innerHTML; }
function toast(msg){ const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(window._tt); window._tt = setTimeout(() => t.classList.remove('show'), 2200); }
function timeAgo(d){
  if (!d) return 'recently';
  const n = Date.now() - new Date(d).getTime(), m = Math.floor(n/60000);
  if (m < 1) return 'just now';
  if (m < 60) return m + 'm ago';
  const h = Math.floor(m/60); if (h < 24) return h + 'h ago';
  const days = Math.floor(h/24); if (days < 7) return days + 'd ago';
  return new Date(d).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
}

auth.onAuthStateChanged(user => { currentUser = user || null; renderAuthSlot(); });

function renderAuthSlot(){
  const slot = document.getElementById('auth-slot');
  if (!slot) return;
  if (currentUser) slot.innerHTML = '<a href="/dashboard.html" class="nav-link">' + esc(currentUser.displayName || 'Dashboard') + '</a>';
  else slot.innerHTML = '<a href="/login.html" class="nav-link">Sign in</a>';
}

function setTab(tab){
  document.getElementById('tabChangelogs').classList.toggle('active', tab === 'changelogs');
  document.getElementById('tabOrganizations').classList.toggle('active', tab === 'organizations');
  document.getElementById('panelChangelogs').classList.toggle('hidden', tab !== 'changelogs');
  document.getElementById('panelOrganizations').classList.toggle('hidden', tab !== 'organizations');
}

function showError(){
  document.getElementById('loadingState').classList.add('hidden');
  document.getElementById('errorState').classList.remove('hidden');
}

function isUsernameMode(){
  return window.location.pathname.startsWith('/@');
}

function identity(){
  const parts = window.location.pathname.split('/').filter(Boolean);
  return parts[parts.length - 1] || '';
}

async function load(){
  if (isUsernameMode()) return loadByUsername(identity());
  return loadByUid(identity());
}

async function loadByUsername(username){
  if (!username || username === 'user-profile.html') { showError(); return; }
  try {
    const res = await fetch('/api/profiles/' + encodeURIComponent(username));
    if (!res.ok) { showError(); return; }
    const data = await res.json();
    render(data.profile, data.stats, data.changelogs || [], data.organizations || [], !!data.isFollowing);
  } catch (err) { showError(); }
}

async function loadByUid(uid){
  if (!uid || uid === 'user-profile.html') { showError(); return; }
  try {
    const [profRes, clRes, followingRes, followersRes] = await Promise.all([
      fetch('/api/users/' + encodeURIComponent(uid) + '/profile'),
      fetch('/api/users/' + encodeURIComponent(uid) + '/changelogs'),
      fetch('/api/users/' + encodeURIComponent(uid) + '/following'),
      fetch('/api/users/' + encodeURIComponent(uid) + '/followers'),
    ]);
    if (!profRes.ok) { showError(); return; }
    const prof = await profRes.json();
    const cl = clRes.ok ? await clRes.json() : { items: [] };
    const following = followingRes.ok ? await followingRes.json() : { users: [], organizations: [] };
    const followers = followersRes.ok ? await followersRes.json() : { items: [] };

    const profile = {
      uid,
      username: null,
      displayName: prof.displayName,
      photoURL: prof.photoURL,
      bio: prof.bio,
      websiteUrl: '', xUrl: '', githubUrl: '',
    };
    const stats = {
      publicChangelogs: prof.stats ? prof.stats.publicChangelogs : (cl.items || []).length,
      totalStars: prof.stats ? prof.stats.totalStars : 0,
      followers: (followers.items || []).length,
      following: (following.users || []).length + (following.organizations || []).length,
    };
    render(profile, stats, cl.items || [], following.organizations || [], false);
  } catch (err) { showError(); }
}

function render(profile, stats, changelogs, organizations, following){
  document.getElementById('loadingState').classList.add('hidden');
  document.getElementById('profileView').classList.remove('hidden');
  document.title = profile.displayName + ' · Forkd';
  profileUid = profile.uid;
  isFollowing = following;

  const avatar = document.getElementById('profileAvatar');
  if (profile.photoURL) {
    avatar.outerHTML = '<img class="profile-avatar" id="profileAvatar" src="' + esc(profile.photoURL) + '" alt="" referrerpolicy="no-referrer"/>';
  } else {
    avatar.textContent = (profile.displayName || 'A').charAt(0).toUpperCase();
  }

  document.getElementById('profileName').textContent = profile.displayName;
  document.getElementById('profileHandle').textContent = profile.username ? '@' + profile.username : '';

  const bio = document.getElementById('profileBio');
  bio.textContent = profile.bio || '';
  bio.style.display = profile.bio ? '' : 'none';

  const links = [];
  if (profile.websiteUrl) links.push('<a href="' + esc(profile.websiteUrl) + '" target="_blank" rel="noopener">Website</a>');
  if (profile.xUrl) links.push('<a href="' + esc(profile.xUrl) + '" target="_blank" rel="noopener">X</a>');
  if (profile.githubUrl) links.push('<a href="' + esc(profile.githubUrl) + '" target="_blank" rel="noopener">GitHub</a>');
  document.getElementById('profileLinks').innerHTML = links.join('');

  if (profile.uid) {
    const rss = document.getElementById('rssLink');
    rss.href = '/rss/users/' + encodeURIComponent(profile.uid);
    rss.classList.remove('hidden');
  }

  const s = stats || {};
  document.getElementById('profileStats').innerHTML =
    stat(s.publicChangelogs || changelogs.length, 'changelogs') +
    stat(s.followers || 0, 'followers') +
    stat(s.following || 0, 'following') +
    stat(s.totalStars || 0, 'stars');

  setFollowState(following);
  // Don't show a follow button on your own profile.
  document.getElementById('followBtn').style.display = (currentUser && currentUser.uid === profileUid) ? 'none' : '';

  const cl = document.getElementById('changelogList');
  if (!changelogs.length) {
    cl.innerHTML = '<div class="empty-state">No public changelogs yet.</div>';
  } else {
    cl.innerHTML = changelogs.map(c => {
      const href = c.slug ? '/changelog/' + encodeURIComponent(c.slug) : '/shared/' + encodeURIComponent(c.id);
      return '<a class="item" href="' + href + '">' +
        '<div class="item-top"><span class="item-title">' + esc(c.title) + '</span>' +
          (c.version ? '<span class="ver">' + esc(c.version) + '</span>' : '') + '</div>' +
        '<div class="item-excerpt">' + esc(c.excerpt || '') + '</div>' +
        '<div class="item-meta"><span>' + timeAgo(c.publishedAt || c.createdAt) + '</span>' +
          (c.orgName ? '<span>·</span><span>' + esc(c.orgName) + '</span>' : '') +
          '<span>·</span><span>' + (c.stars || 0) + ' stars</span></div>' +
      '</a>';
    }).join('');
  }

  const ol = document.getElementById('orgList');
  if (!organizations.length) {
    ol.innerHTML = '<div class="empty-state">Not part of any organization yet.</div>';
  } else {
    ol.innerHTML = organizations.map(o => {
      const avatar2 = o.avatarUrl
        ? '<img class="profile-avatar" style="width:36px;height:36px;font-size:.9rem;" src="' + esc(o.avatarUrl) + '" alt="" referrerpolicy="no-referrer"/>'
        : '<div class="profile-avatar" style="width:36px;height:36px;font-size:.9rem;">' + esc((o.name || 'O').charAt(0).toUpperCase()) + '</div>';
      return '<a class="item" style="display:flex;align-items:center;gap:.75rem;" href="/org/' + encodeURIComponent(o.slug) + '">' +
        avatar2 + '<div><div class="item-title">' + esc(o.name || o.slug) + '</div>' +
        (o.role ? '<div class="item-meta" style="margin-top:.2rem;"><span>' + esc(o.role) + '</span></div>' : '') + '</div></a>';
    }).join('');
  }
}

function stat(value, label){ return '<div class="stat"><strong>' + (value || 0) + '</strong>' + label + '</div>'; }

function setFollowState(following){
  isFollowing = following;
  const btn = document.getElementById('followBtn');
  btn.classList.toggle('following', following);
  document.getElementById('followText').textContent = following ? 'Following' : 'Follow';
}

async function toggleFollow(){
  if (!currentUser) { window.location.href = '/login.html'; return; }
  if (!profileUid) return;
  try {
    const token = await currentUser.getIdToken();
    const res = await fetch('/api/users/' + encodeURIComponent(profileUid) + '/follow', {
      method: isFollowing ? 'DELETE' : 'POST',
      headers: { Authorization: 'Bearer ' + token },
    });
    if (res.status === 401) { window.location.href = '/login.html'; return; }
    if (!res.ok) { toast('Could not update follow. Try again.'); return; }
    const data = await res.json();
    setFollowState(!!data.following);
    toast(data.following ? 'Following' : 'Unfollowed');
  } catch (e) { toast('Could not update follow. Try again.'); }
}

document.addEventListener('DOMContentLoaded', load);
</script>
</body>
</html>
